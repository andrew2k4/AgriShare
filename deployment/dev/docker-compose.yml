services:
  db:
    image: postgres:17-alpine
    container_name: agricul-db
    restart: unless-stopped
    env_file:
      - .env.template
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    container_name: agricul-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.template
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: agricul-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
