server {
    listen 80;
    server_name app.agrishare.farm api.agrishare.farm;

    location / {
        # allow/deny would be a no-op here: `return` runs in the rewrite phase,
        # before the access phase allow/deny is checked. $cf_ip (cloudflare-geo.conf)
        # keeps the check and the return in the same (rewrite) phase.
        if ($cf_ip = 0) { return 403; }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.agrishare.farm;
    include /etc/nginx/conf.d/cloudflare-ips.inc;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.agrishare.farm;
    include /etc/nginx/conf.d/cloudflare-ips.inc;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# mail.agrishare.farm is DNS-only (not proxied by Cloudflare): Mailcow needs direct
# reachability for SMTP and for Let's Encrypt to validate its own certificate here,
# since browsers don't trust the Cloudflare Origin CA used by app/api above.
server {
    listen 80;
    server_name mail.agrishare.farm;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://nginx-mailcow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail.agrishare.farm;

    ssl_certificate     /etc/nginx/letsencrypt/live/mail.agrishare.farm/fullchain.pem;
    ssl_certificate_key /etc/nginx/letsencrypt/live/mail.agrishare.farm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128m;

    location / {
        proxy_pass http://nginx-mailcow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
