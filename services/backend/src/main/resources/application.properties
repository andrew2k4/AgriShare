spring.application.name=agricul
server.port=8000

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agricul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}

# Firebase auth. Defaults to true (fail closed): with false, the API is wide open and every
# request runs as an ADMIN dev-user, so only set FIREBASE_ENABLED=false for local development.
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}

# Comma-separated list of allowed CORS origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:9002}

# Public URL of the frontend, used to build the links sent by e-mail
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Outgoing e-mail (verification and password-reset links). When disabled, links are only logged.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:AgriShare <no-reply@agrishare.farm>}
spring.mail.host=${MAIL_HOST:mail.agrishare.farm}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:no-reply@agrishare.farm}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Server-side sessions (Spring Session JDBC, tables created by Flyway V15).
# Idle timeout, then an absolute limit after login whatever the activity.
spring.session.timeout=${SESSION_IDLE_TIMEOUT:30m}
app.session.absolute-timeout=${SESSION_ABSOLUTE_TIMEOUT:12h}
# Secure cookies with the __Host- prefix. Browsers accept Secure cookies on http://localhost,
# so keep true in dev too; set COOKIE_SECURE=false only for plain-HTTP hosts other than localhost.
app.cookie.secure=${COOKIE_SECURE:true}

# No default in-memory user ("Using generated security password"): accounts live in app_users
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
