spring.datasource.url=jdbc:h2:mem:agricul;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false


app.cors.allowed-origins=http://localhost:3000
app.frontend-url=http://localhost:3000
app.mail.enabled=false
app.mail.from=AgriShare <no-reply@agrishare.farm>
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
